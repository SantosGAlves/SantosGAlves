name: Gerar gráfico de contribuições

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 6h no horário de Brasília
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7EE08F&color_dots=#15171B,#1f3a28,#2e6b3f,#4fa865,#7EE08F&color_background=#0E0F12

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
